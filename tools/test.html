<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IOCoin Sync - Geometría Corregida</title>
  <style>
    :root {
      --bg: #050A12;
      --bg-2: #020711;
      --accent: #33A2DA;
      --accent-soft: #8ad9ff;
      --ink: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.72);
      
      /* Configuración de la elipse */
      --radius-x: 320px; /* Radio horizontal (más ancho) */
      --radius-y: 160px; /* Radio vertical (más bajo) */
      --center-x: 50%;
      --center-y: 50%;
    }

    html, body {
      margin: 0; height: 100%;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      font-family: system-ui, sans-serif;
      color: var(--ink);
      display: grid; place-items: center;
    }

    .preview {
      width: min(1180px, calc(100vw - 48px));
      height: 760px;
      border-radius: 26px;
      background: rgba(3,9,18,0.98);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* Títulos y Stats */
    .header { text-align: center; padding-top: 40px; }
    .title { font-size: 48px; margin: 0; font-weight: 500; }
    .stats { font-size: 28px; color: var(--accent); margin-top: 10px; }

    .stage {
      position: absolute;
      inset: 0;
      top: 120px; /* Espacio para el header */
    }

    /* Base de Datos Central */
    .center-db {
      position: absolute;
      left: var(--center-x);
      top: var(--center-y);
      width: 180px;
      height: 180px;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(51,162,218,0.15), transparent 70%);
      border-radius: 50%;
      border: 1px solid rgba(51,162,218,0.3);
    }

    .db-icon { width: 70px; height: 80px; }

    /* Contenedor de Nodos */
    .nodes-container {
      position: absolute;
      inset: 0;
    }

    /* Lógica de los Nodos (8 nodos) */
    .node-wrapper {
      position: absolute;
      left: var(--center-x);
      top: var(--center-y);
      /* Calculamos la posición en la elipse usando el ángulo --a */
      /* x = cos(a) * rx, y = sin(a) * ry */
      --pos-x: calc(cos(var(--a)) * var(--radius-x));
      --pos-y: calc(sin(var(--a)) * var(--radius-y));
      transform: translate(calc(var(--pos-x) - 50%), calc(var(--pos-y) - 50%));
    }

    .node-dot {
      width: 32px;
      height: 32px;
      background: radial-gradient(circle at 30% 30%, #fff, var(--accent));
      border-radius: 50%;
      box-shadow: 0 0 20px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    /* Líneas conectoras */
    .connector {
      position: absolute;
      left: 0; top: 0;
      /* La longitud es la hipotenusa entre el nodo y el centro */
      /* Como el centro es 0,0 en el wrapper, la longitud es sqrt(x^2 + y^2) */
      --len: calc(sqrt((var(--pos-x) * var(--pos-x)) + (var(--pos-y) * var(--pos-y))));
      width: var(--len);
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0.3;
      transform-origin: 0 50%;
      /* Rotamos la línea para que mire exactamente al centro */
      transform: rotate(calc(var(--a) + 180deg));
      z-index: 1;
    }

    /* Cubos de datos */
    .cube {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--accent-soft);
      border-radius: 2px;
      box-shadow: 0 0 10px var(--accent);
      offset-path: ray(calc(var(--a) + 180deg)); /* Trayectoria perfecta al centro */
      animation: travel 2.5s linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes travel {
      0% { 
        offset-distance: 0%; 
        opacity: 0; 
        transform: scale(1) rotate(0deg);
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { 
        offset-distance: var(--len); 
        opacity: 0;
        transform: scale(0.5) rotate(90deg);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.1); filter: brightness(1.3); }
    }

    /* Definición de ángulos para los 8 nodos */
    .n1 { --a: 0deg;   --delay: 0s; }
    .n2 { --a: 45deg;  --delay: 0.3s; }
    .n3 { --a: 90deg;  --delay: 0.6s; }
    .n4 { --a: 135deg; --delay: 0.9s; }
    .n5 { --a: 180deg; --delay: 1.2s; }
    .n6 { --a: 225deg; --delay: 1.5s; }
    .n7 { --a: 270deg; --delay: 1.8s; }
    .n8 { --a: 315deg; --delay: 2.1s; }

  </style>
</head>
<body>

  <div class="preview">
    <div class="header">
      <h1 class="title">Syncing with the network</h1>
      <div class="stats">Current block: 5,540,998 - Blocks left: 2,414</div>
    </div>

    <div class="stage">
      <div class="center-db">
        <svg class="db-icon" viewBox="0 0 120 140">
          <ellipse cx="60" cy="22" rx="42" ry="14" fill="#8ad9ff"/>
          <path d="M18 22v28c0 7.8 18.8 14 42 14s42-6.2 42-14V22" fill="#2a90cf"/>
          <ellipse cx="60" cy="50" rx="42" ry="14" fill="#5bbef0"/>
          <path d="M18 50v28c0 7.8 18.8 14 42 14s42-6.2 42-14V50" fill="#247fbc"/>
          <ellipse cx="60" cy="78" rx="42" ry="14" fill="#4aaee3"/>
          <path d="M18 78v28c0 7.8 18.8 14 42 14s42-6.2 42-14V78" fill="#1c6faa"/>
          <ellipse cx="60" cy="106" rx="42" ry="14" fill="#3e9fd7"/>
        </svg>
      </div>

      <div class="nodes-container">
        <div class="node-wrapper n1"><div class="node-dot"></div><div class="connector"></div><div class="cube"></div></div>
        <div class="node-wrapper n2"><div class="node-dot"></div><div class="connector"></div><div class="cube"></div></div>
        <div class="node-wrapper n3"><div class="node-dot"></div><div class="connector"></div><div class="cube"></div></div>
        <div class="node-wrapper n4"><div class="node-dot"></div><div class="connector"></div><div class="cube"></div></div>
        <div class="node-wrapper n5"><div class="node-dot"></div><div class="connector"></div><div class="cube"></div></div>
        <div class="node-wrapper n6"><div class="node-dot"></div><div class="connector"></div><div class="cube"></div></div>
        <div class="node-wrapper n7"><div class="node-dot"></div><div class="connector"></div><div class="cube"></div></div>
        <div class="node-wrapper n8"><div class="node-dot"></div><div class="connector"></div><div class="cube"></div></div>
      </div>
    </div>
  </div>

</body>
</html>
